[package]
name = "invertdb-larry"
version = "0.1.0"
edition = "2024"
description = "Blobs: append-only, memory-mapped"
license = "MIT OR Apache-2.0"
repository = "https://github.com/invertdb/larry"

# larry was taken on crates.io; in code it is still `larry`
[lib]
name = "larry"

[dependencies]
memmap2 = "0.9.11"
opentelemetry = { version = "0.33.1", default-features = false, features = ["metrics"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3.27.0"
